<!DOCTYPE html>
<html lang='es'>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, initial-scale=1.0'>
		<title>Sedriast´s portafolio</title>
		<link rel='stylesheet' href='styles/login.css'>
		<link rel='stylesheet' href='styles/main.css'>
		<link rel='stylesheet' href='styles/roulette.css'>
	</head>
	<body>
		<div id='login-screen'>
			<button id='google-login-btn'>
				<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'>
					<path d='M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z' fill='#4285F4'/>
					<path d='M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z' fill='#34A853'/>
					<path d='M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z' fill='#FBBC05'/>
					<path d='M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z' fill='#EA4335'/>
				</svg>
				Iniciar sesión con Google
			</button>
			<span id='login-error'></span>
		</div>

		<div id='app' style='display:none'>
			<div id='gift-screen' style='display:none'>
				<div class='gift-card'>
					<span id='gift-emoji'></span>
					<p id='gift-title'>Tu regalo es:</p>
					<p id='gift-name'></p>
				</div>
			</div>
			<header id='loading-screen'>
				<span class='loader'></span>
				<span class='loading-text'>Cargando...</span>
			</header>
			<div id='animation-container'>
				<img id='animation-frame' src='' alt='Animation'>
			</div>
			<div id='scroll-hint' class='hidden'>
				<span class='scroll-hint-arrow'></span>
			</div>
			<div id='scroll-spacer'></div>

			<div id='confirm-section'>
				<button id='confirm-btn'>Confirmar asistencia</button>
			</div>

			<div id='roulette-screen'>
				<canvas id='roulette-canvas'></canvas>
				<button id='spin-btn'>Girar</button>
				<div id='roulette-result'>
					<div class='result-card'>
						<span id='result-emoji'></span>
						<p id='result-title'>Obtuviste:</p>
						<p id='result-text'></p>
						<p id='result-saved'></p>
						<button id='result-close'>Cerrar</button>
					</div>
				</div>
			</div>
		</div>

		<script src='https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js'></script>
		<script src='https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js'></script>
		<script src='https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js'></script>
		<script src='scripts/login.js'></script>
		<script src='scripts/main.js'></script>
		<script src='scripts/roulette.js'></script>
	</body>
</html>
